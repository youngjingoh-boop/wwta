<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WWTA — Play with us (video post)</title>

<!-- WWTA design-system typefaces: Archivo (display) / Manrope (body). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">

<style>
/* design-system tokens used by this post (inlined from _ds/tokens) */
:root{
  --court-900:#0f2c1f;
  --brand:#c4d92e;
  --on-brand:#15191b;
  --text-on-dark:#eef1ea;
  --text-on-dark-dim:#a9b3ac;
  --border-on-dark:rgba(255,255,255,.14);
  --font-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius-pill:999px;
  --shadow-brand:0 10px 24px rgba(167,188,24,.35);
}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0;background:#000}
/* Fixed 1080x1920 story canvas, scaled to fit */
#stage{position:absolute;top:50%;left:50%;width:1080px;height:1920px;overflow:hidden;background:var(--court-900);display:flex;flex-direction:column;transform-origin:center center}
/* Video occupies the upper region (the framed box) */
.videowrap{position:relative;flex:0 0 1452px;overflow:hidden}
.videowrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
/* subtle top vignette so the brand chip reads on bright sky */
.top-scrim{position:absolute;top:0;left:0;right:0;height:300px;background:linear-gradient(180deg,rgba(15,44,31,.45) 0%,rgba(15,44,31,0) 100%);z-index:2}
/* short scrim only at the base of the video, behind the headline */
.text-scrim{position:absolute;left:0;right:0;bottom:0;height:440px;background:linear-gradient(180deg,rgba(15,44,31,0) 0%,rgba(12,36,25,.9) 100%);z-index:2}
.topbar{position:absolute;top:52px;left:64px;right:64px;display:flex;align-items:center;z-index:4}
.brandmark{display:flex;align-items:center;gap:14px;background:rgba(15,44,31,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--border-on-dark);border-radius:var(--radius-pill);padding:12px 22px 12px 16px}
.brandmark img{height:34px;width:auto;display:block}
.brandmark span{font-family:var(--font-display);font-weight:800;letter-spacing:.16em;font-size:15px;color:var(--text-on-dark);text-transform:uppercase}
/* headline block anchored to the bottom edge of the video */
.caption{position:absolute;left:64px;right:64px;bottom:40px;z-index:3;color:var(--text-on-dark)}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-family:var(--font-body);font-weight:800;font-size:20px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-on-dark-dim);margin-bottom:22px;white-space:nowrap}
.eyebrow i{width:34px;height:5px;border-radius:3px;background:var(--brand);display:inline-block}
.headline{font-family:var(--font-display);font-weight:900;font-size:150px;line-height:.9;letter-spacing:-.03em;margin:0;color:#fff;white-space:nowrap;text-shadow:0 4px 30px rgba(0,0,0,.3)}
/* solid court-green band below the video */
.band{flex:1;background:var(--court-900);padding:52px 64px 96px;display:flex;flex-direction:column;justify-content:space-between}
.locations{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px}
.loc{font-family:var(--font-body);font-weight:700;font-size:38px;color:var(--brand);white-space:nowrap}
.locations .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);display:inline-block}
.footer{display:flex;align-items:center;justify-content:space-between;padding-top:34px;border-top:1px solid var(--border-on-dark)}
.url{font-family:var(--font-body);font-weight:700;font-size:34px;color:var(--text-on-dark)}
.pill{font-family:var(--font-body);font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:.04em;background:var(--brand);color:var(--on-brand);border-radius:var(--radius-pill);padding:18px 34px;box-shadow:var(--shadow-brand)}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div class="videowrap">
      <video id="clip" src="images/Video-525.mp4" autoplay muted loop playsinline></video>
      <div class="top-scrim"></div>
      <div class="topbar">
        <div class="brandmark"><img src="images/logo_white.png" alt="WWTA"><span>WWTA</span></div>
      </div>
      <div class="text-scrim"></div>
      <div class="caption">
        <div class="eyebrow"><i></i>Worldwide Tennis Academy · Est. 2010</div>
        <h2 class="headline">Play with us.</h2>
      </div>
    </div>
    <div class="band">
      <div class="locations">
        <span class="loc">Auburn</span><span class="dot"></span>
        <span class="loc">Burwood</span><span class="dot"></span>
        <span class="loc">North Ryde</span><span class="dot"></span>
        <span class="loc">Granville</span>
      </div>
      <div class="footer">
        <span class="url">wwta.com.au</span>
        <span class="pill">Learn more</span>
      </div>
    </div>
  </div>
</div>
<script>
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);fit();
const clip=document.getElementById('clip');
clip.play().catch(()=>{document.addEventListener('click',()=>clip.play(),{once:true});});
</script>
</body>
</html>
