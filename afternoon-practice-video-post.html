<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WWTA — Afternoon practice (plain video post)</title>

<!-- WWTA design-system typeface: Manrope (body) / Archivo (display).
     Inlined from the design system's tokens/fonts.css + tokens/typography.css
     so this post renders standalone. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">

<style>
:root{
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0;background:#000}
#stage{position:absolute;top:50%;left:50%;width:1080px;height:1920px;overflow:hidden;background:#000;transform-origin:center center}
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%}
/* default social-media caption: white fill, black stroke */
.cap{position:absolute;left:60px;right:60px;top:470px;z-index:2;text-align:center;font-family:var(--font-body);font-weight:800;font-size:34px;line-height:1.22;color:#fff;letter-spacing:.005em;
  -webkit-text-stroke:1.5px #000;
  paint-order:stroke fill;
  text-shadow:0 2px 8px rgba(0,0,0,.45);}
.cap .pin{white-space:nowrap}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <video id="clip" src="images/Video-525.mp4" autoplay muted loop playsinline></video>
    <div class="cap">Afternoon practice with Coach Jaden<br><span class="pin">📍 Burwood</span></div>
  </div>
</div>
<script>
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);fit();
const clip=document.getElementById('clip');
clip.play().catch(()=>{document.addEventListener('click',()=>clip.play(),{once:true});});
</script>
</body>
</html>
